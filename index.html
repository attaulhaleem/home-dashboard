<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plash Personal Dashboard - Ultimate</title>
  <link rel="stylesheet" href="theme.css?v=30">
</head>
<body>

  <div class="left-column">

    <!-- HERO: CLOCK, WEATHER, GREETING (intentionally unboxed — the one bold element) -->
    <div class="time-wrapper">
      <div class="top-info">
        <span id="greeting" class="greeting">Hello, Atta</span>
        <div id="weather" class="weather-widget">
          <span id="weather-icon" class="weather-icon"></span>
          <span id="weather-temp">--°</span>
        </div>
      </div>
      <div class="time-main-row" style="display: flex; align-items: center; gap: 16px;">
        <h1 id="time">00:00</h1>
        <div class="time-details" style="display: flex; flex-direction: column; justify-content: center; margin-top: 8px;">
          <p id="date" style="margin: 0 0 4px 0;">Loading...</p>
          <div class="world-clocks" style="margin: 0; display: flex; gap: 12px;">
            <div class="world-clock">LON <span id="time-lon">--:--</span></div>
            <div class="world-clock">LHE <span id="time-lhe">--:--</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- HACKER NEWS TICKER -->
    <div class="panel ticker-panel">
      <div class="ticker-label">HN</div>
      <a id="hn-link" href="#" target="_blank" class="ticker-content">Loading news...</a>
    </div>

    <!-- QUICK LINKS -->
    <div class="panel links-panel">
      <a href="https://youtube.com" class="quick-link">
        <span class="quick-link-icon"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg></span>
        <span class="quick-link-label">YouTube</span>
      </a>
      <a href="https://duolingo.com" class="quick-link">
        <span class="quick-link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></span>
        <span class="quick-link-label">Duolingo</span>
      </a>
      <a href="https://github.com" class="quick-link">
        <span class="quick-link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,7 4,12 9,17"/><polyline points="15,7 20,12 15,17"/></svg></span>
        <span class="quick-link-label">GitHub</span>
      </a>
      <a href="https://mastervar.telecom-sudparis.eu/schedule.html" class="quick-link">
        <span class="quick-link-icon"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,4 22,9 12,14 2,9"/><rect x="9.5" y="13.3" width="5" height="3" rx="1"/><rect x="19.2" y="9" width="1.4" height="6" rx="0.7"/></svg></span>
        <span class="quick-link-label">M2 VAR</span>
      </a>
    </div>

    <div class="dashboard-grid">
      <!-- AMBIENT SOUND -->
      <div class="panel ambient-panel">
        <div class="ambient-content" style="gap: 4px; padding-bottom: 8px;">
          <div class="visualizer" id="visualizer" style="height: 30px;">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
          <div class="track-name" id="track-name" style="margin-top: 4px;">Not playing</div>
        </div>
        <div class="audio-controls">
          <button class="audio-btn" id="btn-rain" title="Rain" onclick="toggleAudio('rain', 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg', 0.2)">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="8.5" r="3.4"/><circle cx="13" cy="6.5" r="4.2"/><circle cx="16.5" cy="9" r="3"/><rect x="6" y="8" width="13" height="5" rx="2.5"/><rect x="7.5" y="16" width="1.8" height="4.5" rx="0.9" transform="rotate(15 8.4 18.25)"/><rect x="12" y="16.5" width="1.8" height="4.5" rx="0.9" transform="rotate(15 12.9 18.75)"/><rect x="16" y="16" width="1.8" height="4.5" rx="0.9" transform="rotate(15 16.9 18.25)"/></svg>
          </button>
          <button class="audio-btn" id="btn-cafe" title="Cafe" onclick="toggleAudio('cafe', 'https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg', 0.6)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z" fill="currentColor" stroke="none"/><path d="M17 11a3 3 0 0 1 0 6"/><line x1="8" y1="3" x2="8" y2="5"/><line x1="12" y1="2.5" x2="12" y2="5"/></svg>
          </button>
        </div>
        <audio id="ambient-player" loop></audio>
      </div>

      <!-- FRENCH PRACTICE (flashcards) -->
      <div class="panel french-panel" id="french-card" onclick="frenchFlip()" style="display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; padding: 12px;">
        <button class="star-btn" id="french-star" style="display:none;" onclick="frenchToggleKnown(event)" title="Mark as known">
          <svg viewBox="0 0 24 24"><polygon points="12,3 14.23,8.93 20.56,9.22 15.61,13.17 17.29,19.28 12,15.8 6.71,19.28 8.39,13.17 3.44,9.22 9.77,8.93"/></svg>
        </button>
        
        <div style="position: relative; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center;">
          <div class="french-word" id="french-word" style="font-size: 1.2rem;">Loading...</div>
          <div class="french-back" id="french-back" style="position: absolute; top: 100%; left: 0; right: 0;">
            <div class="french-translation" id="french-translation" style="font-size: 1rem;"></div>
          </div>
          <div class="french-hint" id="french-hint" style="position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;">Tap to reveal</div>
        </div>
        
        <button onclick="frenchNext(event)" title="Refresh" class="refresh-btn" style="position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; width: 28px; height: 28px; color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l5.67-2.61"/></svg>
        </button>
      </div>

      <!-- TASKS (local only — not synced to any app) -->
      <div class="tasks-panel">
        <div class="tasks-input-container">
          <input type="text" id="task-input" placeholder="Add a task…" onkeypress="handleTaskSubmit(event)">
          <button onclick="addTask()" class="btn-add" title="Add">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="10.2" y="4" width="3.6" height="16" rx="1.4"/><rect x="4" y="10.2" width="16" height="3.6" rx="1.4"/></svg>
          </button>
        </div>
        <ul id="task-list" class="task-list"></ul>
      </div>

      <!-- NOTES (plain local scratchpad) -->
      <div class="notes-panel">
        <textarea id="scratchpad" class="scratchpad" placeholder="Jot something down…"></textarea>
      </div>

      <!-- EXCALIDRAW CANVAS -->
      <div class="panel excalidraw-panel" style="grid-column: 1 / -1; padding: 0; overflow: hidden; height: 100%;">
        <iframe src="https://excalidraw.com/?theme=dark" style="width: 100%; height: 100%; border: none; border-radius: 24px;"></iframe>
      </div>
    </div>

  </div>

  <script src="flashcards.js?v=30"></script>
  <script src="script.js?v=30"></script>
</body>
</html>
