<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plash Personal Dashboard - Ultimate</title>
  <style>
    :root {
      --panel-bg: rgba(22, 22, 28, 0.72);
      --panel-border: rgba(255, 255, 255, 0.07);
      --accent: #9d7dfa;
      --accent-hover: #8161da;
      --text-main: #f3f4f6;
      --text-muted: #8b8e9b;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }
    
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: transparent;
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      user-select: none;
    }

    /* Left Column Container */
    .left-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 40px 0 120px 40px; /* 120px bottom clearance for Dock */
      width: 620px; /* Constrained so it doesn't hit Apple Widgets */
      gap: 16px;
    }

    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.45);
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
    }

    /* --- CLOCK & WORLD TIME --- */
    .time-wrapper h1 {
      font-size: 5rem;
      margin: 0;
      font-weight: 200;
      letter-spacing: -3px;
      line-height: 0.95;
      background: linear-gradient(180deg, #ffffff 30%, #a8a8b2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .time-wrapper p {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin: 10px 0 14px 4px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .world-clocks {
      display: flex;
      gap: 20px;
      margin-left: 6px;
    }
    .world-clock {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #999;
    }
    .world-clock span { color: var(--text-main); font-weight: bold; }

    /* --- NEWS TICKER --- */
    .ticker-panel {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ticker-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: bold;
      white-space: nowrap;
    }
    .ticker-content {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      color: var(--text-main);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .ticker-content:hover { opacity: 0.7; }

    /* --- MIDDLE ROW (Focus + Habits) --- */
    .middle-row {
      display: flex;
      gap: 16px;
      height: 160px;
    }
    
    /* Focus & Audio */
    .focus-panel { flex: 1; display: flex; flex-direction: column; }
    .timer-display {
      font-size: 3rem;
      font-weight: 200;
      text-align: center;
      margin: 5px 0;
      font-variant-numeric: tabular-nums;
    }
    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: bold;}
    
    .audio-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      border-top: 1px solid var(--panel-border);
      padding-top: 10px;
    }
    .audio-btn {
      background: none; border: none; cursor: pointer; font-size: 1.2rem;
      opacity: 0.5; transition: opacity 0.2s;
    }
    .audio-btn:hover, .audio-btn.playing { opacity: 1; }

    /* Habits Grid */
    .habits-panel { width: 240px; }
    .habit-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .habit-cell {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .habit-cell:hover { background: rgba(255,255,255,0.15); }
    .habit-cell.done { background: var(--accent); }

    /* --- BOTTOM ROW (Calendar + Scratchpad) --- */
    .bottom-row {
      display: flex;
      gap: 16px;
      height: 220px;
    }

    .cal-container { width: 230px; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }
    .cal-header { color: var(--text-muted); font-size: 0.65rem; padding-bottom: 6px; }
    .cal-day { padding: 4px 0; border-radius: 6px; color: #999; }
    .cal-day.today { background: var(--accent); color: #0d0d11; font-weight: bold; }

    .scratchpad-container { flex: 1; display: flex; flex-direction: column; }
    .scratchpad {
      flex: 1;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      color: var(--text-main);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      resize: none;
      outline: none;
      line-height: 1.5;
      user-select: text;
    }
    .scratchpad:focus { border-color: var(--accent); }
    .scratchpad::placeholder { color: #555; }
  </style>
</head>
<body>

  <div class="left-column">
    
    <!-- 1. CLOCK & WORLD CLOCKS -->
    <div class="time-wrapper">
      <h1 id="time">00:00</h1>
      <p id="date">Loading...</p>
      <div class="world-clocks">
        <div class="world-clock">LON <span id="time-lon">--:--</span></div>
        <div class="world-clock">LHR <span id="time-lhe">--:--</span></div>
      </div>
    </div>

    <!-- 2. HACKER NEWS TICKER -->
    <div class="panel ticker-panel">
      <div class="ticker-label">HN TOP:</div>
      <a id="hn-link" href="#" target="_blank" class="ticker-content">Loading news...</a>
    </div>

    <div class="middle-row">
      <!-- 3. FOCUS TIMER & AUDIO -->
      <div class="panel focus-panel">
        <div class="section-title"><span>Focus Center</span></div>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button class="btn" onclick="startTimer(25)">25m</button>
          <button class="btn" onclick="startTimer(5)">5m</button>
          <button class="btn" onclick="stopTimer()">Stop</button>
        </div>

        <div class="audio-controls">
          <button class="audio-btn" id="btn-rain" title="Rain" onclick="toggleAudio('rain', 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg', 0.2)">🌧️</button>
          <button class="audio-btn" id="btn-cafe" title="Cafe" onclick="toggleAudio('cafe', 'https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg', 0.6)">☕</button>
          <button class="audio-btn" id="btn-forest" title="Forest" onclick="toggleAudio('forest', 'https://actions.google.com/sounds/v1/water/woodland_stream_with_birds.ogg', 0.8)">🌲</button>
        </div>
        
        <audio id="ambient-player" loop></audio>
      </div>
        
      <!-- 4. HABIT TRACKER -->
      <div class="panel habits-panel">
        <div class="section-title"><span>30-Day Habit</span></div>
        <div class="habit-grid" id="habit-grid"></div>
      </div>
    </div>

    <div class="bottom-row">
      <!-- 5. MINI CALENDAR -->
      <div class="panel cal-container">
        <div class="section-title"><span id="cal-month-title">Calendar</span></div>
        <div class="cal-grid" id="cal-days"></div>
      </div>

      <!-- 6. SCRATCHPAD -->
      <div class="panel scratchpad-container">
        <div class="section-title"><span>Scratchpad</span></div>
        <textarea id="scratchpad" class="scratchpad" placeholder="// Type here..."></textarea>
      </div>
    </div>

  </div>

  <script>
    // --- 1. CLOCKS ---
    function updateClocks() {
      const now = new Date();
      // Main Clock
      document.getElementById('time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
      
      // World Clocks updated for London and Lahore
      const options = { hour: '2-digit', minute: '2-digit', hour12: false };
      document.getElementById('time-lon').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'Europe/London' }).format(now);
      document.getElementById('time-lhe').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'Asia/Karachi' }).format(now);
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // --- 2. HACKER NEWS TICKER ---
    let hnStories = [];
    let hnIndex = 0;
    async function fetchHN() {
      try {
        const res = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
        const ids = await (await res.json()).slice(0, 10); // Get top 10
        
        hnStories = await Promise.all(ids.map(id => 
          fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())
        ));
        rotateHN();
      } catch (e) {
        document.getElementById('hn-link').innerText = "Unable to fetch news.";
      }
    }
    function rotateHN() {
      if(hnStories.length === 0) return;
      const story = hnStories[hnIndex];
      const linkEl = document.getElementById('hn-link');
      linkEl.innerText = story.title;
      linkEl.href = story.url || `https://news.ycombinator.com/item?id=${story.id}`;
      
      hnIndex = (hnIndex + 1) % hnStories.length;
    }
    fetchHN();
    setInterval(rotateHN, 8000); // Rotate every 8 seconds
    setInterval(fetchHN, 1800000); // Fetch fresh news every 30 mins

    // --- 3. FOCUS TIMER ---
    let timerInt;
    let secondsLeft = 25 * 60;
    
    function updateTimerDisplay() {
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
    }
    
    function startTimer(minutes) {
      clearInterval(timerInt);
      secondsLeft = minutes * 60;
      updateTimerDisplay();
      
      timerInt = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if (secondsLeft <= 0) {
          clearInterval(timerInt);
          new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg').play();
        }
      }, 1000);
    }
    
    function stopTimer() {
      clearInterval(timerInt);
      secondsLeft = 25 * 60;
      updateTimerDisplay();
    }

    // --- 4. AMBIENT AUDIO ---
    const player = document.getElementById('ambient-player');
    let currentAudio = '';

    function toggleAudio(id, url, volumeLevel) {
      const btnRain = document.getElementById('btn-rain');
      const btnCafe = document.getElementById('btn-cafe');
      const btnForest = document.getElementById('btn-forest');
      
      // Reset all buttons
      btnRain.classList.remove('playing');
      btnCafe.classList.remove('playing');
      btnForest.classList.remove('playing');

      if (currentAudio === id) {
        player.pause();
        currentAudio = '';
      } else {
        player.src = url;
        player.volume = volumeLevel; 
        player.play();
        document.getElementById(`btn-${id}`).classList.add('playing');
        currentAudio = id;
      }
    }

    // --- 5. HABIT TRACKER ---
    function buildHabits() {
      const grid = document.getElementById('habit-grid');
      let habits = JSON.parse(localStorage.getItem('plash_habits')) || {};
      const todayStr = new Date().toISOString().split('T')[0];
      
      // Generate last 30 days
      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        
        const cell = document.createElement('div');
        cell.className = 'habit-cell';
        cell.title = dateStr;
        
        if (habits[dateStr]) cell.classList.add('done');
        
        // Only allow clicking today's cell to prevent cheating!
        if (i === 0) {
          cell.onclick = () => {
            habits[dateStr] = !habits[dateStr];
            localStorage.setItem('plash_habits', JSON.stringify(habits));
            cell.classList.toggle('done');
          };
        } else {
          cell.style.cursor = 'default';
        }
        
        grid.appendChild(cell);
      }
    }
    buildHabits();

    // --- 6. MINI CALENDAR ---
    function buildCalendar() {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      const today = now.getDate();

      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      document.getElementById('cal-month-title').innerText = `${monthNames[currentMonth]} ${currentYear}`;

      const calGrid = document.getElementById('cal-days');
      calGrid.innerHTML = '';

      const dayHeaders = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
      dayHeaders.forEach(d => {
        const span = document.createElement('div');
        span.className = 'cal-header';
        span.innerText = d;
        calGrid.appendChild(span);
      });

      let firstDay = new Date(currentYear, currentMonth, 1).getDay();
      firstDay = (firstDay === 0) ? 6 : firstDay - 1;

      const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calGrid.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= totalDays; d++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'cal-day' + (d === today ? ' today' : '');
        dayDiv.innerText = d;
        calGrid.appendChild(dayDiv);
      }
    }
    buildCalendar();

    // --- 7. SCRATCHPAD ---
    const pad = document.getElementById('scratchpad');
    pad.value = localStorage.getItem('plash_scratchpad') || '';
    pad.addEventListener('input', () => {
      localStorage.setItem('plash_scratchpad', pad.value);
    });
  </script>
</body>
</html>
